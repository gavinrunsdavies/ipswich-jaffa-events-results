# Basic workflow to push all code changes from master to the JAFFA live site

name: 🚀 Deploy to live website on push

on:
  push:
    branches: [ 'main' ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:

  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    environment: Live JAFFA
    env:
      EVENTS_RESULTS_DB_HOST: ${{ vars.EVENTS_RESULTS_DB_HOST }}
      EVENTS_RESULTS_DB_NAME: ${{ vars.EVENTS_RESULTS_DB_NAME }}
      EVENTS_RESULTS_DB_USER: ${{ vars.EVENTS_RESULTS_DB_USER }}
      EVENTS_RESULTS_DB_PASSWORD: ${{ secrets.EVENTS_RESULTS_DB_PASSWORD }}
    steps:

    - name: 🚚 Get latest code
      uses: actions/checkout@v2

    - name: 📝 Write runtime database config (inject secrets)
      shell: bash
      run: |
        mkdir -p api
        echo "<?php" > api/config.php
        echo "// Generated during CI deploy. Do NOT commit secrets to source control." >> api/config.php
        echo "if (!defined('EVENTS_RESULTS_DB_HOST')) {" >> api/config.php
        echo "  define('EVENTS_RESULTS_DB_HOST', '${EVENTS_RESULTS_DB_HOST}');" >> api/config.php
        echo "}" >> api/config.php
        echo "if (!defined('EVENTS_RESULTS_DB_NAME')) {" >> api/config.php
        echo "  define('EVENTS_RESULTS_DB_NAME', '${EVENTS_RESULTS_DB_NAME}');" >> api/config.php
        echo "}" >> api/config.php
        echo "if (!defined('EVENTS_RESULTS_DB_USER')) {" >> api/config.php
        echo "  define('EVENTS_RESULTS_DB_USER', '${EVENTS_RESULTS_DB_USER}');" >> api/config.php
        echo "}" >> api/config.php
        echo "if (!defined('EVENTS_RESULTS_DB_PASSWORD')) {" >> api/config.php
        echo "  define('EVENTS_RESULTS_DB_PASSWORD', '${EVENTS_RESULTS_DB_PASSWORD}');" >> api/config.php
        echo "}" >> api/config.php

    # Deploy files to live site via FTP
    - name: 📂 Sync files to live
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: ftp.ipswichjaffa.org.uk
        username: github-ipswich-jaffa-events-results@ipswichjaffa.org.uk
        password: ${{ secrets.FtpServerPassword }}
        server-dir: public_html/wordpress/wp-content/plugins/ipswich-jaffa-events-results/
        dry-run: false
        exclude: |
          **/.git*
          **/.git*/**
